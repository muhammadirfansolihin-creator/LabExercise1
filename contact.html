<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="style.css">
	<meta charset="UTF-8">
	<meta name="description" content="width=device-width, initial-scale=1.0">
	<title>Contact</title>
</head>

<body>
	<header>
		<h1>Contact Me</h1>
	</header>
	<nav>
		<ul>
			<a href="index.html" class="active" >Home</a>
			<a href="about.html" class="active">About Me</a>
			<a href="skills.html" class="active">Skills</a>
			<a href="academic.html" class="active">Academic Record</a>
			<a href="projects.html" class="active">Projects</a>
			<a href="contact.html" class="active">Contact Me</a>
		</ul>
	</nav>

	<main>
		<section>
			
			<form action="#" method="post">
				<fieldset>
					<legend>Contact Information</legend>

					<label for="name">Name:</label>
					<input type="text" id= "name" name="name" required maxlength="60" placeholder="Your Name">
					<br><br>

					<label for="email">Email:</label>
					<input type="email" id="email" name="email" required placeholder="youremail@gmail.com">
					<br><br>

					<label for="phone">Phone Number:</label>
					<input type="tel" id="phone" name="phone" maxlength="8" placeholder="e.g. +60********">
					<br><br>

					<label for="date">Date:</label>
					<input type="date" id="date" name="date">
					<br><br>

					<label for="range">Rating (0-10):</label>
					<input type="range" id="range" name="range" min="0" max="10">
					<br><br>

					<p>Interest:</p>
					<input type="checkbox" id="cb1" name="interest" value="web"> <label for="cb1">Web Developer</label>
					<input type="checkbox" id="cb2" name="interest" value="data"> <label for="cb2">Data Science</label>
					<input type="checkbox" id="cb3" name="interest" value="ai"> <label for="cb3">AI</label>
					<br><br>

					<p>Contact Preferences</p>
					<input type="radio" id="r1" name="pref" value="email"> <label for="r2">Email</label>
					<input type="radio" id="r1" name="pref" value="phone"> <label for="r2">Phone</label>
					<input type="radio" id="r3" name="pref" value="none"> <label for="r3">N/A</label>
					<br><br>

					<label for="subj">Subject:</label>
					<select id="subj" name="subj">
						<optgroup label="Subject">
							<option value="cpad">SCSM2223</option>
							<option value="ad1">SCSE2243</option>
							<option value="sda">SCSE2233</option>
						</optgroup>
					</select>
					<br><br>

					<label for="message">Note:</label><br>
					<textarea id="message" name="message"></textarea>
					<br><br>

					<button type="submit">Submit Form</button>

				</fieldset>
			</form>
		</section>
	</main>	
<footer></footer>
</body>
</html>
